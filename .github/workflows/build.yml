name: Build Passwall2 for RT-AC68U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git \
            gettext libssl-dev xsltproc rsync wget unzip zlib1g-dev file \
            python3

      - name: 下载并解压 OpenWrt SDK (22.03.5 / bcm53xx generic)
        run: |
          wget https://downloads.openwrt.org/releases/22.03.5/targets/bcm53xx/generic/openwrt-sdk-22.03.5-bcm53xx-generic_gcc-11.2.0_musl_eabi.Linux-x86_64.tar.xz
          tar xf openwrt-sdk-22.03.5-bcm53xx-generic_gcc-11.2.0_musl_eabi.Linux-x86_64.tar.xz
          # 确认解压出的目录名
          ls -d openwrt-sdk-*/

      - name: 加入 Passwall2 及依赖源
        run: |
          SDK_DIR=$(ls -d openwrt-sdk-*/ | head -n1)
          cd "$SDK_DIR"
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall2.git package/openwrt-passwall2
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/openwrt-passwall-packages

      - name: 更新 feeds 并生成配置
        run: |
          SDK_DIR=$(ls -d openwrt-sdk-*/ | head -n1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 编译 Passwall2 与 sing-box 核心
        run: |
          SDK_DIR=$(ls -d openwrt-sdk-*/ | head -n1)
          cd "$SDK_DIR"
          make package/openwrt-passwall2/compile V=s -j$(nproc)
          make package/sing-box/compile V=s -j$(nproc)

      - name: 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: passwall2-ipk-bcm53xx
          path: openwrt-sdk-*/bin/packages/**/*.ipk
